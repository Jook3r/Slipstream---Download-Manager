name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install the desktop app's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # The app looks for slipstream-bridge next to itself, so they ship
      # together, with the browser extension beside them.
      - name: Put the programs and the extension together
        shell: bash
        run: |
          exe=${{ runner.os == 'Windows' && '.exe' || '' }}
          mkdir -p dist
          for name in slipstream-desktop slipstream-bridge slipstream; do
            cp "target/release/$name$exe" dist/
          done
          cp -r extension dist/extension
      - uses: actions/upload-artifact@v6
        with:
          name: slipstream-${{ runner.os }}
          path: dist/
