<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Download File Info</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="window.css">
  <script type="module" src="info.js"></script>
</head>
<body class="dialog-window">
  <form class="info" id="form" autocomplete="off">
    <div class="grid">
      <label for="url">URL</label>
      <input id="url" class="field mono" type="text" spellcheck="false">

      <label for="quality" class="stream-only">Quality</label>
      <select id="quality" class="field stream-only"></select>

      <label for="category">Category</label>
      <select id="category" class="field"></select>

      <label for="path">Save As</label>
      <div class="row">
        <input id="path" class="field mono" type="text" spellcheck="false">
        <button type="button" class="btn small" id="browse" title="Choose where to save">…</button>
      </div>

      <label class="check"><input type="checkbox" id="remember"> <span id="remember-label">Remember this path for this category</span></label>

      <label for="description">Description</label>
      <input id="description" class="field" type="text">
    </div>

    <aside class="filecard">
      <span class="big-icon cat" id="icon"></span>
      <span class="size" id="size">Checking…</span>
      <span class="resume" id="resume"></span>
    </aside>

    <div class="notice" id="notice" role="status" hidden>
      <p class="notice-text" id="notice-text"></p>
      <div class="notice-actions">
        <button type="button" class="btn small" id="retry">Retry</button>
        <button type="button" class="linkish" id="details-toggle">Show details</button>
      </div>
      <pre class="notice-details" id="notice-details" hidden></pre>
    </div>
    <p class="hint warn exists" id="exists" hidden>A file with this name already exists and will be replaced.</p>

    <div class="notice ffmpeg" id="ffmpeg" hidden>
      <p class="notice-text" id="ffmpeg-text"></p>
      <div class="notice-actions">
        <button type="button" class="btn small" id="get-ffmpeg">Get ffmpeg</button>
        <button type="button" class="linkish" id="choose-ffmpeg">I have ffmpeg…</button>
        <span class="hint" id="ffmpeg-progress"></span>
      </div>
    </div>

    <div class="buttons">
      <button type="submit" class="btn" value="later">Download Later</button>
      <button type="submit" class="btn primary" value="start" id="start">Start Download</button>
      <button type="button" class="btn" id="cancel">Cancel</button>
    </div>
  </form>
</body>
</html>
