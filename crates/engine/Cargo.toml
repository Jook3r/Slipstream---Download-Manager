[package]
name = "slipstream-engine"
version.workspace = true
edition.workspace = true

[dependencies]
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
tokio-util = "0.7.20"

[dev-dependencies]
slipstream-test-server = { path = "../test-server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
