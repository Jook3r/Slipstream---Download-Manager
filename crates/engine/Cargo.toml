[package]
name = "slipstream-engine"
version.workspace = true
edition.workspace = true

[dependencies]
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
tokio-util = "0.7.20"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
