[package]
name = "slipstream-bridge"
version.workspace = true
edition.workspace = true
description = "Connects the Slipstream browser extension to the Slipstream app"

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
