<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slipstream</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="28" height="28">
    <div>
      <h1>Slipstream</h1>
      <p id="status" class="status checking">Checking…</p>
      <p id="detail" class="detail" hidden></p>
    </div>
  </header>

  <label class="switch">
    <input type="checkbox" id="enabled">
    <span>Take over downloads</span>
  </label>
  <label class="switch minor">
    <input type="checkbox" id="video-button">
    <span>Show a “Download video” button over videos</span>
  </label>

  <section id="videos" hidden>
    <p class="section-title">Videos on this page</p>
    <ul id="video-list"></ul>
  </section>

  <details>
    <summary>Which downloads</summary>
    <label for="extensions">File types</label>
    <textarea id="extensions" rows="4" spellcheck="false"></textarea>
    <label class="inline">Also any download bigger than <input id="min-size" type="number" min="0" step="1"> MB</label>
  </details>

  <p class="tip">Hold <kbd>Alt</kbd> while clicking a link to let the browser download it.</p>
  <button id="open">Open Slipstream</button>
</body>
</html>
